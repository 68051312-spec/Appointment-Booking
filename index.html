<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riverbend Clinic — Booking Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--scale:1.25;--bg:#FFFFFF;--ink:#1A2B3C;--ink-soft:#3E5266;--surface:#FFFFFF;--surface-2:#E8F0ED;--primary:#0B6E4F;--primary-dark:#095940;--warn-bg:#FFF4CC;--warn-ink:#6B5300;--ok-bg:#E3F4EA;--ok-ink:#0B5A3F;--err-bg:#FCEAEA;--err:#A6261D;--err-dark:#7E1C15;--border:#C9D3CE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible','Noto Sans Thai',Arial,sans-serif;font-size:calc(18px*var(--scale));line-height:1.55}
h1{font-size:1.8em;margin:0 0 .3em}h2{font-size:1.4em;margin:0 0 .4em}p{color:var(--ink-soft)}
.protobar{background:var(--ink);color:#fff;text-align:center;font-size:.8em;padding:6px 10px}
.topbar{padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1em;min-width:0}
.logo{width:2.1em;height:2.1em;flex:none}
.userchip{display:flex;align-items:center;gap:8px;max-width:55%;padding:6px 14px;border-radius:30px;background:var(--surface-2);font-weight:700;color:var(--ink)}
.userchip.guest{background:#F1F3F2;color:var(--ink-soft);font-weight:400}
.userchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip svg{width:1.2em;height:1.2em;flex:none}
.ctlrow{display:flex;justify-content:flex-end;gap:14px;margin-top:8px;flex-wrap:wrap}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{min-width:2.6em;height:2.6em;padding:0 8px;border-radius:8px;border:2px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-weight:700;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.progress{display:flex;gap:6px;padding:14px 20px 0;max-width:700px;margin:0 auto}
.progress:empty{display:none}.progress .step{flex:1;height:8px;border-radius:4px;background:var(--surface-2)}.progress .step.done{background:var(--primary)}
main{max-width:700px;margin:0 auto;padding:16px 20px 170px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-size:1em;font-weight:700;padding:16px 22px;border-radius:12px;border:2px solid transparent;cursor:pointer;min-height:56px;color:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;width:100%}.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--primary);border-color:var(--primary)}
.btn-text{background:none;border:none;color:var(--primary);text-decoration:underline;padding:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}
.select-card{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;font-family:inherit;font-size:1em;color:var(--ink)}
.select-card:hover{border-color:var(--primary)}.select-card.chosen{border-color:var(--primary);background:var(--surface-2)}
.select-card .name{font-weight:700;font-size:1.1em}.select-card .desc{color:var(--ink-soft);margin-top:4px}.select-card .meta{font-weight:700;color:var(--primary);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.chip{padding:12px 16px;min-height:52px;border-radius:30px;border:2px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:1em;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.slot{padding:14px 8px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:1em;font-weight:700;cursor:pointer}
.slot.unavail{opacity:.55;cursor:not-allowed;text-decoration:line-through}.slot.chosen{background:var(--primary);color:#fff;border-color:var(--primary)}
.summary-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}.summary-row:last-child{border-bottom:none}
.summary-row strong{text-align:right}
.banner{border-radius:12px;padding:14px 16px;margin:12px 0;font-weight:700}.banner.err{background:var(--err-bg);color:var(--err-dark)}.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}.banner.ok{background:var(--ok-bg);color:var(--ok-ink)}
.where{background:var(--surface-2);border:2px solid var(--primary);border-radius:14px;padding:18px;margin-bottom:16px}
.where .big{font-weight:700;font-size:1.3em;line-height:1.35}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--warn-bg);color:var(--warn-ink);font-weight:700;font-size:.85em}
.icon-circle{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:700;margin:0 auto 14px}
.icon-circle.ok{background:var(--surface-2);color:var(--primary)}.icon-circle.bad{background:var(--err-bg);color:var(--err)}
.center{text-align:center}.small{font-size:.9em}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=password],select,textarea{width:100%;padding:14px;font-size:1em;font-family:inherit;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-weight:400}.check input{width:1.4em;height:1.4em}
.heroLogo{width:84px;height:84px;display:block;margin:0 0 10px}
.testpanel{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.testpanel .btn{background:#fff;color:var(--ink);padding:10px 14px;min-height:48px}.testpanel .btn-text{background:none;color:#fff}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media print{.protobar,.topbar,.progress,.noprint,.testpanel{display:none!important}main{padding:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="12" fill="#0B6E4F"/><rect x="20.5" y="8" width="7" height="22" rx="2" fill="#fff"/><rect x="13" y="15.5" width="22" height="7" rx="2" fill="#fff"/><path d="M8 37q4-5 8 0t8 0 8 0 8 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="currentColor"/></symbol>
</svg>
<div class="protobar" data-i18n="proto"></div>
<header class="topbar">
  <div class="toprow">
    <span class="brand"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg><span data-i18n="brand"></span></span>
    <span class="userchip guest" id="userChip" aria-live="polite"><svg aria-hidden="true"><use href="#person"/></svg><span id="userName"></span></span>
  </div>
  <div class="ctlrow">
    <div class="ctl" role="group" aria-label="Language / ภาษา">
      <button id="lg-en" onclick="setLang('en')">EN</button>
      <button id="lg-th" onclick="setLang('th')">ไทย</button>
    </div>
    <div class="ctl" role="group" aria-label="Text size">
      <button id="ts-s" onclick="setScale(1,'ts-s')" style="font-size:.8em">A</button>
      <button id="ts-m" onclick="setScale(1.25,'ts-m')" style="font-size:1em" aria-pressed="true">A</button>
      <button id="ts-l" onclick="setScale(1.55,'ts-l')" style="font-size:1.25em">A</button>
    </div>
  </div>
</header>
<div class="progress" id="progressBar" aria-hidden="true"></div>
<main>

<section class="screen" id="screen-home">
  <svg class="heroLogo" role="img" aria-label="Riverbend Clinic logo"><use href="#logo"/></svg>
  <h1 data-i18n="homeTitle"></h1>
  <p data-i18n="homeIntro"></p>
  <div id="homeOut">
    <p><strong data-i18n="loginIntro"></strong></p>
    <button class="btn btn-primary" onclick="go('login')" data-i18n="login"></button>
    <div class="row"><button class="btn btn-secondary" onclick="go('register')" data-i18n="register"></button></div>
  </div>
  <div id="homeIn" class="hidden">
    <div class="banner warn hidden" id="noticeBanner"><span id="noticeBannerText"></span><button class="btn btn-secondary" style="margin-top:10px;width:100%" onclick="go('notices')" data-i18n="viewNotices"></button></div>
    <button class="btn btn-primary" onclick="newBooking()" data-i18n="book"></button>
    <div class="row">
      <button class="btn btn-secondary" onclick="go('myappt')" data-i18n="viewAppt"></button>
      <button class="btn btn-secondary" id="noticeBtn" onclick="go('notices')"></button>
    </div>
    <div class="row">
      <button class="btn btn-secondary" onclick="openProfile()" data-i18n="editProfile"></button>
      <button class="btn btn-secondary" onclick="logout()" data-i18n="logout"></button>
    </div>
  </div>
  <p class="small" id="storeNote"></p>
  <p class="small noprint"><a href="#" onclick="startTest();return false;" data-i18n="testLink"></a> · <a href="#" onclick="openResearcher();return false;" data-i18n="researcher"></a> · <a href="#" id="simClinic" class="hidden" onclick="simClinic();return false"></a></p>
</section>

<section class="screen" id="screen-login">
  <h2 data-i18n="loginTitle"></h2>
  <div id="loginOk" class="banner ok hidden" role="status" data-i18n="pinReset"></div>
  <form onsubmit="doLogin();return false" class="card" novalidate>
    <label for="lu" data-i18n="username"></label>
    <input type="text" id="lu" maxlength="30" autocomplete="off">
    <label for="lp" data-i18n="pin"></label>
    <input type="password" id="lp" inputmode="numeric" maxlength="4" autocomplete="off">
    <label class="check"><input type="checkbox" onchange="togglePin(this,['lp'])"><span data-i18n="showPin"></span></label>
    <div id="loginErr" class="banner err hidden" role="alert"></div>
    <button class="btn btn-primary" type="submit" style="margin-top:14px" data-i18n="login"></button>
    <button class="btn btn-text" type="button" style="margin-top:6px" onclick="go('forgot')" data-i18n="forgotLink"></button>
  </form>
  <p class="small" data-i18n="demoNote"></p>
  <div class="row">
    <button class="btn btn-secondary" onclick="demoLogin()" data-i18n="demoLogin"></button>
    <button class="btn btn-secondary" onclick="go('register')" data-i18n="toRegister"></button>
  </div>
  <div class="row"><button class="btn btn-text" onclick="go('home')" data-i18n="back"></button></div>
</section>

<section class="screen" id="screen-register">
  <h2 data-i18n="registerTitle"></h2>
  <p data-i18n="regNote"></p>
  <form onsubmit="doRegister();return false" class="card" novalidate>
    <label for="ru" data-i18n="username"></label>
    <input type="text" id="ru" maxlength="30" autocomplete="off">
    <div class="small" data-i18n="usernameHint"></div>
    <label for="rp" data-i18n="pin"></label>
    <input type="password" id="rp" inputmode="numeric" maxlength="4" autocomplete="off">
    <label for="rp2" data-i18n="pin2"></label>
    <input type="password" id="rp2" inputmode="numeric" maxlength="4" autocomplete="off">
    <label class="check"><input type="checkbox" onchange="togglePin(this,['rp','rp2'])"><span data-i18n="showPin"></span></label>
    <div id="regErr" class="banner err hidden" role="alert"></div>
    <button class="btn btn-primary" type="submit" style="margin-top:14px" data-i18n="register"></button>
  </form>
  <div class="row">
    <button class="btn btn-secondary" onclick="go('login')" data-i18n="toLogin"></button>
    <button class="btn btn-text" onclick="go('home')" data-i18n="back"></button>
  </div>
</section>

<section class="screen" id="screen-forgot">
  <h2 data-i18n="forgotTitle"></h2>
  <p data-i18n="forgotNote"></p>
  <form onsubmit="doForgot();return false" class="card" novalidate>
    <label for="fn" data-i18n="username"></label>
    <input type="text" id="fn" maxlength="30" autocomplete="off">
    <label for="fa" data-i18n="age"></label>
    <input type="text" id="fa" inputmode="numeric" maxlength="3" autocomplete="off">
    <label for="fnat" data-i18n="nationality"></label>
    <select id="fnat"></select>
    <label for="fp" data-i18n="newPin"></label>
    <input type="password" id="fp" inputmode="numeric" maxlength="4" autocomplete="off">
    <label for="fp2" data-i18n="newPin2"></label>
    <input type="password" id="fp2" inputmode="numeric" maxlength="4" autocomplete="off">
    <label class="check"><input type="checkbox" onchange="togglePin(this,['fp','fp2'])"><span data-i18n="showPin"></span></label>
    <div id="forgotErr" class="banner err hidden" role="alert"></div>
    <button class="btn btn-primary" type="submit" style="margin-top:14px" data-i18n="resetBtn"></button>
  </form>
  <div class="row"><button class="btn btn-secondary" onclick="go('login')" data-i18n="back"></button></div>
</section>

<section class="screen" id="screen-profile">
  <h2 data-i18n="profileTitle"></h2>
  <p data-i18n="profileNote"></p>
  <div class="card">
    <label data-i18n="gender" style="margin-top:0"></label>
    <div class="chips" id="pfGender" role="group"></div>
    <label for="pfAge" data-i18n="age"></label>
    <input type="text" id="pfAge" inputmode="numeric" maxlength="3" autocomplete="off" oninput="pfDraft.age=this.value">
    <label for="pfNat" data-i18n="nationality"></label>
    <select id="pfNat" onchange="pfDraft.nat=this.value"></select>
    <div id="pfErr" class="banner err hidden" role="alert"></div>
  </div>
  <button class="btn btn-primary" onclick="saveProfile()" data-i18n="saveProfile"></button>
  <div class="row" id="pfBackRow"><button class="btn btn-secondary" onclick="go('home')" data-i18n="back"></button></div>
</section>

<section class="screen" id="screen-notices">
  <h2 data-i18n="noticesTitle"></h2>
  <div id="noticeList"></div>
  <button class="btn btn-secondary" onclick="go('home')" data-i18n="backHome"></button>
</section>

<section class="screen" id="screen-myappt">
  <h2 data-i18n="myApptTitle"></h2>
  <div class="card" id="myapptCard"></div>
  <button class="btn btn-secondary" onclick="go('home')" data-i18n="backHome"></button>
</section>

<section class="screen" id="screen-dept">
  <h2 data-i18n="deptH"></h2><p data-i18n="deptIntro"></p>
  <div id="deptList"></div>
  <div class="row"><button class="btn btn-secondary" onclick="go('home')" data-i18n="back"></button><button class="btn btn-primary" id="deptNext" disabled onclick="go('doctor')" data-i18n="next"></button></div>
</section>

<section class="screen" id="screen-doctor">
  <h2 data-i18n="doctorH"></h2><p id="doctorDeptLine" class="small"></p>
  <div id="doctorList"></div>
  <div class="row"><button class="btn btn-secondary" onclick="go('dept')" data-i18n="back"></button><button class="btn btn-primary" id="doctorNext" disabled onclick="go('datetime')" data-i18n="next"></button></div>
</section>

<section class="screen" id="screen-datetime">
  <h2 id="dtTitle" data-i18n="dtH"></h2>
  <p class="small" data-i18n="dateNote"></p>
  <label for="dateSelect" data-i18n="dateLabel"></label>
  <select id="dateSelect" onchange="renderSlots()"></select>
  <p style="margin-top:16px;margin-bottom:0" data-i18n="availTimes"></p>
  <div class="slotgrid" id="slotGrid"></div>
  <div class="banner warn" id="fullNote" data-i18n="fullNote"></div>
  <p id="chosenLine" style="font-weight:700"></p>
  <div class="row"><button class="btn btn-secondary" onclick="backFromDT()" data-i18n="back"></button><button class="btn btn-primary" id="dtNext" disabled onclick="nextFromDT()" data-i18n="next"></button></div>
</section>

<section class="screen" id="screen-visit">
  <h2 data-i18n="visitH"></h2>
  <p data-i18n="visitIntro"></p>
  <div class="card">
    <label style="margin-top:0" data-i18n="symptomsLabel"></label>
    <div class="chips" id="sxChips"></div>
    <label for="vText" data-i18n="symptomText"></label>
    <textarea id="vText" maxlength="200" oninput="state.visit.text=this.value"></textarea>
    <div class="small" data-i18n="symptomNote"></div>
  </div>
  <div class="card">
    <label style="margin-top:0" data-i18n="wcLabel"></label>
    <button class="select-card" id="wcNo" onclick="setWc(false)"></button>
    <button class="select-card" id="wcYes" onclick="setWc(true)"></button>
    <div class="small" id="wcHelp"></div>
  </div>
  <div class="row"><button class="btn btn-secondary" onclick="go('datetime')" data-i18n="back"></button><button class="btn btn-primary" onclick="go('review')" data-i18n="next"></button></div>
</section>

<section class="screen" id="screen-review">
  <h2 id="reviewTitle" data-i18n="reviewH"></h2>
  <div class="card" id="reviewCard"></div>
  <div class="row" id="editRow">
    <button class="btn btn-secondary" onclick="go('dept')" data-i18n="editDept"></button>
    <button class="btn btn-secondary" onclick="go('doctor')" data-i18n="editDoctor"></button>
    <button class="btn btn-secondary" onclick="go('datetime')" data-i18n="editTime"></button>
    <button class="btn btn-secondary" onclick="go('visit')" data-i18n="editDetails"></button>
  </div>
  <label class="check noprint" style="margin-top:18px"><input type="checkbox" id="forceFail"><span data-i18n="simFail"></span></label>
  <button class="btn btn-primary" style="margin-top:12px" id="confirmBtn" onclick="confirmBooking()" data-i18n="confirm"></button>
  <div class="row"><button class="btn btn-secondary" onclick="backFromReview()" data-i18n="back"></button></div>
</section>

<section class="screen" id="screen-success">
  <div class="icon-circle ok">✓</div>
  <h2 class="center" id="okTitle" data-i18n="okTitle"></h2>
  <p class="center" id="okNote" data-i18n="protoNote"></p>
  <div class="where" id="whereBox"></div>
  <div class="card" id="successCard"></div>
  <p class="center small" id="savedNote"></p>
  <button class="btn btn-primary noprint" onclick="savePDF()" data-i18n="savePdf"></button>
  <p class="center small noprint" id="pdfNote" role="status"></p>
  <div class="row noprint"><button class="btn btn-secondary" onclick="restart()" data-i18n="returnHome"></button></div>
</section>

<section class="screen" id="screen-error">
  <div class="icon-circle bad">!</div>
  <h2 class="center" data-i18n="errTitle"></h2>
  <p class="center" data-i18n="errBody"></p>
  <button class="btn btn-primary" onclick="go('review')" data-i18n="tryAgain"></button>
  <div class="row"><button class="btn btn-secondary" onclick="go('datetime')" data-i18n="otherTime"></button></div>
</section>
</main>

<div class="testpanel hidden" id="testpanel">
  <strong id="testTaskLabel"></strong>
  <div class="row">
    <button class="btn" onclick="logEvent('help_requested')" data-i18n="help"></button>
    <button class="btn" onclick="nextTask()" data-i18n="markDone"></button>
    <button class="btn btn-text" onclick="endTest()" data-i18n="endTest"></button>
  </div>
</div>

<script>
const T={

async function hashPin(pin,salt){
  if(!(window.crypto&&crypto.subtle))return 'plain:'+pin;
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

    $('okTitle').textContent=t(state.reschedDone?'reschedOk':'okTitle');$('okNote').textContent=t(state.reschedDone?'reschedNote':'protoNote');
    $('savedNote').textContent=t('saved_'+mode);return;
  }
  const list=(data.bookings[user]||[]);list.forEach(b=>{if(!b.id)b.id=newId()});
  $('myapptCard').innerHTML=list.length?list.slice().reverse().map(b=>{const cm=b.status==='clinic_moved';
    return rowsHTML(b)+(cm?`<div class="banner warn">${t('clinicBanner')}</div>`:'')+`<button class="btn ${cm?'btn-primary':'btn-secondary'}" style="width:100%;margin-top:10px" onclick="startReschedule('${b.id}')">${t('reschedule')}</button>`}).join(HR):`<p>${t('noAppt')}</p>`;
}
// ---- PDF (drawn on a canvas, wrapped into a one-page PDF) ----
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrapText(x,text,w){const out=[];let line='';for(const ch of text){if(x.measureText(line+ch).width>w&&line){const i=line.lastIndexOf(' ');if(i>0){out.push(line.slice(0,i));line=line.slice(i+1)+ch}else{out.push(line);line=ch}}else line+=ch}if(line)out.push(line);return out}
function drawSlip(c){
  const dp=deptOf(c.dept),dc=docs[c.dept].find(x=>x.id===c.doc),v=c.visit||blankVisit(),p=c.patient;
  const cv=document.createElement('canvas');cv.width=1240;cv.height=1754;const x=cv.getContext('2d');x.scale(2,2);
  const F="'Atkinson Hyperlegible','Noto Sans Thai',Arial,sans-serif";
  x.fillStyle='#fff';x.fillRect(0,0,620,877);
  x.fillStyle='#0B6E4F';rr(x,36,32,46,46,12);x.fill();
  x.fillStyle='#fff';rr(x,56,38,6,22,2);x.fill();rr(x,49,45,20,7,2);x.fill();
  x.strokeStyle='#fff';x.lineWidth=2.5;x.lineCap='round';x.beginPath();x.moveTo(44,67);x.quadraticCurveTo(49,62,54,67);x.quadraticCurveTo(59,72,64,67);x.quadraticCurveTo(69,62,74,67);x.stroke();
  x.fillStyle='#1A2B3C';x.font='700 24px '+F;x.fillText(t('brand'),96,62);
  x.font='700 22px '+F;x.fillText(t('slipTitle'),40,122);
  x.fillStyle='#A6261D';x.font='400 13px '+F;x.fillText(t('protoNote'),40,146);
  x.strokeStyle='#C9D3CE';x.lineWidth=1;x.beginPath();x.moveTo(40,160);x.lineTo(580,160);x.stroke();
  x.fillStyle='#E8F0ED';rr(x,40,176,540,96,12);x.fill();x.strokeStyle='#0B6E4F';x.lineWidth=2;x.stroke();
  x.fillStyle='#3E5266';x.font='400 13px '+F;x.fillText(t('where'),56,198);
  x.fillStyle='#1A2B3C';x.font='700 20px '+F;x.fillText(L(dp.loc.b),56,226);x.fillText(t('floor').replace('{n}',dp.loc.f),56,254);
  const rows=[];
  if(p){rows.push([t('patient'),p.name]);if(p.gender)rows.push([t('about'),aboutText(p)])}
  rows.push([t('department'),L(dp.n)],[t('doctor'),L(dc.n)],[t('dateTime'),fmtWhen(c.date,c.time)],[t('symptoms'),symText(v).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")],[t('wheelchair'),t(v.wc?'yes':'no')]);
  let y=304;
  rows.forEach(([l,val])=>{x.fillStyle='#3E5266';x.font='400 13px '+F;x.fillText(l,40,y);x.fillStyle='#1A2B3C';x.font='700 15px '+F;
    const lines=wrapText(x,val,380);lines.forEach((ln,i)=>x.fillText(ln,200,y+i*21));
    y+=Math.max(1,lines.length)*21+8;x.strokeStyle='#E3E8E5';x.lineWidth=1;x.beginPath();x.moveTo(40,y-10);x.lineTo(580,y-10);x.stroke();y+=14});
  x.fillStyle='#1A2B3C';x.font='700 14px '+F;x.fillText(t('arrive'),40,Math.max(y+20,800));
  if(v.wc){x.font='400 13px '+F;x.fillText(t('wcHelp'),40,Math.max(y+42,822))}
  x.fillStyle='#A6261D';x.font='400 12px '+F;x.fillText(t('protoNote'),40,860);
  return cv;
}
function makePdf(jpg,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  push('%PDF-1.4\n');
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n');(Array.isArray(body)?body:[body]).forEach(push);push('\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  const cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
  obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  obj(5,['<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n',jpg,'\nendstream']);
  const xr=len;push('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}
async function savePDF(){
  const c=state.confirmed;if(!c)return;logEvent('pdf_click');
  try{
    const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
    if(!dl){window.print();return}
    if(document.fonts){try{await Promise.all([document.fonts.load("700 15px 'Noto Sans Thai'",'กา'),document.fonts.load("400 13px 'Noto Sans Thai'",'กา'),document.fonts.load("700 15px 'Atkinson Hyperlegible'",'A'),document.fonts.load("400 13px 'Atkinson Hyperlegible'",'A')])}catch(_){}await document.fonts.ready}
    const cv=drawSlip(c),b64=cv.toDataURL('image/jpeg',0.92).split(',')[1],bin=atob(b64),jpg=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
    await dl.save({filename:'appointment-slip.pdf',data:makePdf(jpg,cv.width,cv.height)});
    $('pdfNote').textContent=t('pdfSaved');
  }catch(e){if(e&&e.code==='declined')return;try{window.print()}catch(_){}}
}
// ---- reschedule + notices ----
function newBooking(){state=blank();go('dept')}
function startReschedule(id){const b=findB(id);if(!b)return;state=blank();Object.assign(state,{dept:b.dept,doctor:b.doc,date:dateKeys.includes(b.date)?b.date:dateKeys[0],time:null,resched:id,visit:JSON.parse(JSON.stringify(b.visit||blankVisit()))});logEvent('reschedule_start');go('datetime')}
async function confirmResched(){
  await ready;const b=findB(state.resched);if(!b){go('myappt');return}
  const oldD=b.date,oldT=b.time;b.date=state.date;b.time=state.time;delete b.status;
  (data.notices[user]=data.notices[user]||[]).push({id:newId(),type:'moved',dept:b.dept,doc:b.doc,oldDate:oldD,oldTime:oldT,newDate:b.date,newTime:b.time,at:Date.now(),read:false});
  await save();state.confirmed=b;state.reschedDone=true;logEvent('rescheduled');go('success');
}
async function simClinic(){
  await ready;const b=(data.bookings[user]||[]).slice().reverse().find(x=>x.status!=='clinic_moved');if(!b)return;
  b.status='clinic_moved';
  (data.notices[user]=data.notices[user]||[]).push({id:newId(),type:'clinic',dept:b.dept,doc:b.doc,oldDate:b.date,oldTime:b.time,at:Date.now(),read:false});
  await save();logEvent('clinic_postponed');homeExtras();
}
function homeExtras(){
  const n=user?(data.notices[user]||[]).filter(x=>!x.read).length:0;
  $('noticeBanner').classList.toggle('hidden',!n);$('noticeBannerText').textContent=t('newNotices').replace('{n}',n);
  $('noticeBtn').textContent=t('notices')+(n?' ('+n+')':'');

  $('simClinic').classList.toggle('hidden',!has);$('simClinic').textContent=t('simClinic');
}
function noticeHTML(n){
  const dp=deptOf(n.dept),dc=docs[n.dept].find(x=>x.id===n.doc);
  const txt=t(n.type==='clinic'?'noticeClinic':'noticeMoved').replace('{dept}',L(dp.n)).replace('{doc}',L(dc.n)).replace('{old}',fmtWhen(n.oldDate,n.oldTime)).replace('{new}',n.newDate?fmtWhen(n.newDate,n.newTime):'');
  return `<div class="card">${n.read?'':`<span class="badge">${t('newTag')}</span> `}<span>${txt}</span><div class="small" style="margin-top:6px">${new Date(n.at).toLocaleString(lang==='th'?'th-TH':'en-GB')}</div></div>`;
}
function renderNotices(){
  const all=data.notices[user]||[];
  $('noticeList').innerHTML=all.length?all.slice().reverse().map(noticeHTML).join(''):`<p>${t('noNotices')}</p>`;
  if(all.some(n=>!n.read)){all.forEach(n=>n.read=true);save()}
}
